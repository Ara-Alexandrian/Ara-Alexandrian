<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ara Alexandrian — Medical Physicist and Software Developer</title>
  <desc id="desc">Editorial banner with intersecting beam lines representing clinical science and software engineering.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="1" stop-color="#0B2C3D"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#background)"/>
  <path d="M760 0 565 360" stroke="url(#beam)" stroke-width="34" opacity="0.34" filter="url(#soft)"/>
  <path d="M1040 0 565 360" stroke="url(#beam)" stroke-width="28" opacity="0.26" filter="url(#soft)"/>
  <path d="M1200 98 565 360" stroke="url(#beam)" stroke-width="18" opacity="0.2" filter="url(#soft)"/>
  <path d="M760 0 565 360M1040 0 565 360M1200 98 565 360" stroke="#38BDF8" stroke-width="1.5" opacity="0.32"/>
  <circle cx="565" cy="360" r="74" fill="none" stroke="#2DD4BF" stroke-width="1" opacity="0.22"/>
  <circle cx="565" cy="360" r="38" fill="#2DD4BF" opacity="0.08"/>

  <text x="74" y="82" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="3">CLINICAL SCIENCE / SOFTWARE SYSTEMS</text>
  <text x="70" y="175" fill="#F8FAFC" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700">Ara Alexandrian</text>
  <text x="74" y="224" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="0.4">Medical Physicist · Software Developer</text>

  <g transform="translate(74 282)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2">
    <text x="0" y="0" fill="#F8FAFC">CARE</text>
    <line x1="52" y1="-5" x2="90" y2="-5" stroke="#F59E0B" stroke-width="2"/>
    <text x="104" y="0" fill="#F8FAFC">CODE</text>
    <line x1="156" y1="-5" x2="194" y2="-5" stroke="#F59E0B" stroke-width="2"/>
    <text x="208" y="0" fill="#F8FAFC">CLARITY</text>
  </g>
</svg>