<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ara Alexandrian — medical physicist working across software, systems, and operations</title>
  <desc id="desc">A dark systems-map banner connecting physics, data, infrastructure, operations, and agents around human judgment.</desc>
  <style>
    @keyframes orbit-clockwise { to { transform: rotate(360deg); } }
    @keyframes orbit-counter { to { transform: rotate(-360deg); } }
    @keyframes scan-field {
      0%, 100% { transform: translateY(-105px); opacity: 0; }
      12% { opacity: .12; }
      50% { opacity: .34; }
      88% { opacity: .12; }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(.96); opacity: .16; }
      50% { transform: scale(1.08); opacity: .42; }
    }
    @keyframes travel { to { stroke-dashoffset: -64; } }
    .orbit-a { transform-box: fill-box; transform-origin: center; animation: orbit-clockwise 140s linear infinite; }
    .orbit-b { transform-box: fill-box; transform-origin: center; animation: orbit-counter 190s linear infinite; }
    .scan { animation: scan-field 28s ease-in-out infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: breathe 9s ease-in-out infinite; }
    .travel { animation: travel 22s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .orbit-a, .orbit-b, .scan, .pulse, .travel { animation: none; }
    }
  </style>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8CA0B3" stroke-width="0.6" opacity="0.13"/>
    </pattern>
    <linearGradient id="acid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B7FF3C"/>
      <stop offset="1" stop-color="#64D8FF"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="system-field"><circle r="122"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="14" fill="#07090C"/>
  <rect width="1200" height="420" rx="14" fill="url(#grid)"/>
  <path class="travel" d="M76 326H508" fill="none" stroke="#64D8FF" stroke-width="1" stroke-dasharray="2 14" opacity="0.32"/>
  <path d="M0 30H1200M0 390H1200" stroke="#B7FF3C" stroke-width="2" opacity="0.75"/>
  <path d="M46 0V420M1154 0V420" stroke="#FF4D8D" stroke-width="1" opacity="0.45"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="76" y="78" fill="#B7FF3C" font-size="14" letter-spacing="3">FIELD NOTES // SYSTEMS UNDER PRESSURE</text>
    <text x="73" y="177" fill="#F5F7FA" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700">Ara Alexandrian</text>
    <text x="77" y="225" fill="#8CA0B3" font-size="19" letter-spacing="1.4">MEDICAL PHYSICIST // SOFTWARE // SYSTEMS // OPERATIONS</text>
    <text x="77" y="295" fill="#F5F7FA" font-size="17" letter-spacing="2">DOMAIN DEPTH</text>
    <text x="236" y="295" fill="#FFB000" font-size="17">×</text>
    <text x="269" y="295" fill="#F5F7FA" font-size="17" letter-spacing="2">OPERATIONAL RANGE</text>
    <text x="77" y="352" fill="#8CA0B3" font-size="12" letter-spacing="1.4">BATON ROUGE / 30.45°N / SYSTEM STATE: BUILDING</text>
  </g>

  <g transform="translate(845 211)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle r="126" fill="#0B0F14" opacity="0.95"/>
    <g class="orbit-a">
      <circle r="126" fill="none" stroke="#8CA0B3" stroke-width="1" stroke-dasharray="3 7" opacity="0.9"/>
      <circle cx="0" cy="-126" r="3.5" fill="#FFB000" filter="url(#glow)"/>
    </g>
    <circle r="78" fill="none" stroke="#64D8FF" stroke-width="1" opacity="0.35"/>
    <g class="orbit-b">
      <circle cx="78" cy="0" r="3" fill="#64D8FF" filter="url(#glow)"/>
      <circle cx="-78" cy="0" r="2" fill="#FF4D8D"/>
    </g>
    <g clip-path="url(#system-field)">
      <line class="scan" x1="-116" y1="0" x2="116" y2="0" stroke="#64D8FF" stroke-width="1.5"/>
      <rect class="scan" x="-116" y="0" width="232" height="28" fill="#64D8FF" opacity="0.025"/>
    </g>
    <circle class="pulse" r="45" fill="#B7FF3C" opacity="0.16"/>
    <circle r="33" fill="#10151B" stroke="url(#acid)" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="-5" fill="#F5F7FA" font-size="10" text-anchor="middle" letter-spacing="1">HUMAN</text>
    <text x="0" y="9" fill="#F5F7FA" font-size="10" text-anchor="middle" letter-spacing="1">JUDGMENT</text>

    <path d="M0-33V-101M27-19 91-65M31 11 102 39M-25 21-83 70M-33-7-105-34" stroke="#8CA0B3" stroke-width="1.2" opacity="0.8"/>
    <path d="M0-101 91-65 102 39-83 70-105-34Z" fill="none" stroke="#FF4D8D" stroke-width="1" opacity="0.45"/>

    <g fill="#07090C" stroke="#B7FF3C" stroke-width="1.5">
      <circle cx="0" cy="-101" r="17"/><circle cx="91" cy="-65" r="17"/><circle cx="102" cy="39" r="17"/><circle cx="-83" cy="70" r="17"/><circle cx="-105" cy="-34" r="17"/>
    </g>
    <g fill="#F5F7FA" font-size="10" text-anchor="middle">
      <text x="0" y="-98">PHYS</text><text x="91" y="-62">DATA</text><text x="102" y="42">AGENT</text><text x="-83" y="73">INFRA</text><text x="-105" y="-31">OPS</text>
    </g>
  </g>

  <g fill="#8CA0B3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
    <text x="1030" y="58">67 REPOS</text><text x="1030" y="74">10 LANGS</text><text x="1030" y="90">29 ACTIVE</text>
  </g>
  <path d="M1168 338h-38v38" fill="none" stroke="#FFB000" stroke-width="2"/>
</svg>
